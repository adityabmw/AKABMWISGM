<div class="login-container">

    <div class="login-card">

        <div class="logo-area">

            <img src="/src/assets/images/logo.png" class="logo">

            <h1>AKA BMW</h1>

            <p>Integrated System Gateway Management</p>

        </div>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email">

            <input
                type="password"
                id="password"
                placeholder="Password">

            <label>

                <input type="checkbox">

                Remember Me

            </label>

            <button id="btnLogin">

                LOGIN

            </button>

        </form>

    </div>

</div>

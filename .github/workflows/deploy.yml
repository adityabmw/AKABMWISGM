name: 🚀 Deploy AKABMWISGM to Firebase

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: SECURITY & QUALITY CHECK
  # ============================================================
  security-check:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ============================================================
  # JOB 2: BUILD & TEST
  # ============================================================
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Build project
        run: npm run build --if-present

  # ============================================================
  # JOB 3: DEPLOY TO FIREBASE
  # ============================================================
  deploy:
    name: 🚀 Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Create Firebase config
        run: |
          cat > .env << ENVFILE
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVFILE

      - name: Deploy to Firebase Hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Notify WhatsApp (Success)
        if: success()
        run: |
          curl -X POST "https://api.fonnte.com/send" \
            -H "Authorization: ${{ secrets.WHATSAPP_API_KEY }}" \
            -d "target=${{ secrets.OWNER_PHONE }}" \
            -d "message=✅ AKABMWISGM DEPLOYED!\n\n📦 Commit: ${{ github.sha }}\n👤 By: ${{ github.actor }}\n🔗 ${{ steps.deploy.outputs.url }}"

      - name: Notify WhatsApp (Failure)
        if: failure()
        run: |
          curl -X POST "https://api.fonnte.com/send" \
            -H "Authorization: ${{ secrets.WHATSAPP_API_KEY }}" \
            -d "target=${{ secrets.OWNER_PHONE }}" \
            -d "message=❌ AKABMWISGM DEPLOY FAILED!\n\n📦 Commit: ${{ github.sha }}\n👤 By: ${{ github.actor }}\n🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

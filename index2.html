<!DOCTYPE html>
<html>
<head>
  <title>AKA BMW · LOGIN TEST</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <style>
    body { background:#0a0c10; color:#e8edf5; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
    .box { background:#141b2b; padding:40px; border-radius:20px; border-left:4px solid #1a8cff; width:320px; }
    input { width:100%; padding:12px; margin:8px 0; background:#0a0c10; border:1px solid #1e2a3a; color:#fff; border-radius:8px; }
    button { width:100%; padding:12px; background:#1a8cff; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer; }
    #status { margin-top:12px; text-align:center; }
  </style>
</head>
<body>
<div class="box">
  <h2 style="margin-bottom:16px;">🔐 AKA BMW LOGIN</h2>
  <input id="email" placeholder="Email" />
  <input id="pass" type="password" placeholder="Password" />
  <button id="btnLogin">Login</button>
  <div id="status"></div>
</div>

<script>
  const config = {
    apiKey: "AIzaSyC9tLGHRc-_8gnNsUOfLQDTshbEAVHaR7c",
    authDomain: "akabmwisgm.firebaseapp.com",
    projectId: "akabmwisgm",
    storageBucket: "akabmwisgm.firebasestorage.app",
    messagingSenderId: "317584647702",
    appId: "1:317584647702:web:8d7b6dbd9334f973eeb737"
  };
  firebase.initializeApp(config);
  const auth = firebase.auth();

  const btn = document.getElementById('btnLogin');
  const status = document.getElementById('status');

  btn.addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    status.innerText = '⏳ Loading...';
    status.style.color = '#facc15';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      status.innerText = '✅ Login BERHASIL!';
      status.style.color = '#4ade80';
    } catch (err) {
      status.innerText = '❌ ' + err.message;
      status.style.color = '#f87171';
    }
  });

  auth.onAuthStateChanged((user) => {
    if (user) {
      status.innerText = '👋 Halo, ' + user.email;
      status.style.color = '#4ade80';
    }
  });
</script>
</body>
</html>

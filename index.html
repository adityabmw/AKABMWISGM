<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKA BMW ISGM v5 — Integrated System Gateway Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131b2b;--border:#1e293b;--accent:#00b4d8;--text:#e2e8f0;--muted:#8a9bb5}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0;font-family:system-ui,-apple-system,sans-serif}
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);position:fixed;height:100vh;overflow:auto;top:0;left:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-item{padding:10px 16px;color:var(--muted);cursor:pointer;display:flex;gap:10px;font-size:13px;border-left:3px solid transparent;text-decoration:none;align-items:center}
.sidebar-item:hover{background:#0f172a;color:var(--text)}
.sidebar-item.active{background:#0f172a;color:var(--accent);border-left-color:var(--accent)}
.main{margin-left:240px;padding:20px;min-height:100vh}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto}
.btn-info{background:var(--accent);border-color:var(--accent)}
.text-info{color:var(--accent)!important}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner-border text-info" role="status"></div>
  <div style="margin-top:10px;color:var(--muted)">Loading ISGM v5...</div>
</div>

<div id="toastContainer" style="position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px"></div>

<div id="dashboardPage" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <b style="color:var(--accent)">AKA BMW</b><br>
      <small style="color:var(--muted)">ISGM v5 + AVIS</small><br>
      <small id="userInfo" style="color:var(--accent)">Guest</small>
    </div>
    <a href="#dashboard" class="sidebar-item nav-route"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <a href="#customers" class="sidebar-item nav-route"><i class="fa-solid fa-users"></i> Customers</a>
    <a href="#vehicles" class="sidebar-item nav-route"><i class="fa-solid fa-car"></i> Vehicles</a>
    <a href="#reception" class="sidebar-item nav-route"><i class="fa-solid fa-clipboard-check"></i> Reception</a>
    <a href="#workorders" class="sidebar-item nav-route"><i class="fa-solid fa-wrench"></i> Work Orders</a>
    <a href="#inventory" class="sidebar-item nav-route"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
    <a href="#estimation" class="sidebar-item nav-route"><i class="fa-solid fa-file-invoice"></i> Estimation</a>
    <a href="#invoices" class="sidebar-item nav-route"><i class="fa-solid fa-receipt"></i> Invoices</a>
    <a href="#cashier" class="sidebar-item nav-route"><i class="fa-solid fa-cash-register"></i> Cashier</a>
    <a href="#history" class="sidebar-item nav-route"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
    <a href="#etk" class="sidebar-item nav-route"><i class="fa-solid fa-magnifying-glass"></i> BMW ETK</a>
    <a href="#wiring" class="sidebar-item nav-route"><i class="fa-solid fa-bolt"></i> Wiring</a>
    <a href="#ai-diag" class="sidebar-item nav-route"><i class="fa-solid fa-robot"></i> ASK AKA AI</a>
    <a href="#mechanic" class="sidebar-item nav-route"><i class="fa-solid fa-screwdriver-wrench"></i> Mechanic</a>
    <a href="#booking" class="sidebar-item nav-route"><i class="fa-solid fa-calendar-check"></i> Booking</a>
    <a href="#master" class="sidebar-item nav-route"><i class="fa-solid fa-database"></i> Master</a>
    <a href="#report" class="sidebar-item nav-route"><i class="fa-solid fa-chart-bar"></i> Reports</a>
    <a href="#avis" class="sidebar-item nav-route" style="border:1px solid #00b4d8;color:#00b4d8;margin:8px;border-radius:8px"><i class="fa-solid fa-microchip"></i> AVIS AI</a>
    <div class="p-2">
      <button id="btnLogout" class="btn btn-outline-danger btn-sm w-100">Logout</button>
    </div>
  </div>
  <div class="main">
    <h4>Route: <span id="curRoute" style="color:var(--accent)">DASHBOARD</span></h4>
    <div id="app"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
<script>
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('dashboardPage').style.display='block';
  },300);
});
</script>
</body>
</html>

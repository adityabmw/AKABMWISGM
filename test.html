<!DOCTYPE html>
<html>
<head>
  <title>Test Firebase Login</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
  <h2>🔥 Test Firebase Login</h2>
  <input id="email" placeholder="Email" style="padding:8px;width:250px;" />
  <br/>
  <input id="pass" type="password" placeholder="Password" style="padding:8px;width:250px;margin-top:8px;" />
  <br/>
  <button id="btnLogin" style="margin-top:8px;padding:8px 24px;">Login</button>
  <div id="status" style="margin-top:16px;font-weight:bold;"></div>

  <script>
    const config = {
      apiKey: "AIzaSyC9tLGHRc-_8gnNsUOfLQDTshbEAVHaR7c",
      authDomain: "akabmwisgm.firebaseapp.com",
      projectId: "akabmwisgm",
      storageBucket: "akabmwisgm.firebasestorage.app",
      messagingSenderId: "317584647702",
      appId: "1:317584647702:web:8d7b6dbd9334f973eeb737"
    };
    firebase.initializeApp(config);
    const auth = firebase.auth();

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value;
      const status = document.getElementById('status');
      if (!email || !pass) {
        status.innerText = '❌ Isi email dan password!';
        status.style.color = 'red';
        return;
      }
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        status.innerText = '✅ Login berhasil!';
        status.style.color = 'green';
      } catch (err) {
        status.innerText = '❌ ' + err.message;
        status.style.color = 'red';
      }
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('status').innerText = '👋 Login sebagai: ' + user.email;
        document.getElementById('status').style.color = 'green';
      }
    });
  </script>
</body>
</html>
